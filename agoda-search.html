<!-- Softr Parent Container -->
<style>
  /* --- Wrapper cho iframe --- */
  .agoda-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
    max-width: 1200px; /* desktop rộng hơn */
    margin: 0 auto;
    position: relative;
    z-index: 5;
    overflow: visible !important; /* để suggestion xổ ra */
  }

  .agoda-container {
    position: relative;
    width: 360px; /* desktop default width */
    max-width: 100%;
    height: 48px; /* chỉ vừa search box */
    transition: all 0.3s ease;
    overflow: visible !important; /* popup suggestion xổ ra */
    z-index: 10;
  }

  .agoda-container.focused {
    z-index: 99999 !important;
    position: relative;
    isolation: isolate;
  }

  .agoda-iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 11;
  }

  /* Mobile */
  @media (max-width: 480px) {
    .agoda-container {
      width: 100%;
      max-width: 360px;
      height: 48px; /* chỉ vừa search box */
      overflow: visible !important; /* popup xổ ra */
    }
  }

  /* Phá giới hạn Softr section */
  [data-block-type="custom_code"],
  [data-element-type="custom_code"],
  .custom-html-block,
  .softr-section,
  .softr-view-wrapper,
  section,
  div[data-element-id],
  div[data-block-type],
  .content-wrapper {
    overflow: visible !important;
    position: static !important;
    z-index: auto !important;
  }

  html, body {
    overflow-x: hidden !important;
    overflow-y: auto !important;
  }

  body.agoda-focused {
    overflow-y: hidden !important;
  }
</style>

<div class="agoda-wrapper">
  <div class="agoda-container" id="agodaBox">
    <iframe class="agoda-iframe"
      src="https://xacthucviet.github.io/xacthucviet-tools/agoda-search.html"
      loading="lazy">
    </iframe>
  </div>
</div>

<script>
  const box = document.getElementById('agodaBox');

  // Ngăn Safari tự zoom khi nhập
  const metaViewport = document.querySelector('meta[name="viewport"]');
  if (metaViewport) {
    metaViewport.setAttribute(
      'content',
      'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'
    );
  } else {
    const m = document.createElement('meta');
    m.name = 'viewport';
    m.content =
      'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no';
    document.head.appendChild(m);
  }

  // Listen message từ iframe
  window.addEventListener('message', (e) => {
    if (!box) return;

    if (e.data === 'agoda-focus') {
      box.classList.add('focused');
      document.body.classList.add('agoda-focused');
      let parent = box.parentElement;
      while (parent) {
        parent.style.overflow = 'visible';
        parent = parent.parentElement;
      }
    } else if (e.data === 'agoda-blur') {
      box.classList.remove('focused');
      document.body.classList.remove('agoda-focused');
      box.style.height = '48px';
    } else if (e.data === 'agoda-select-suggestion') {
      // Khi chọn suggestion, thu lại height ngay
      box.classList.remove('focused');
      document.body.classList.remove('agoda-focused');
      box.style.height = '48px';
    } else if (e.data?.type === 'resize' && e.data.height) {
      // Cập nhật height theo iframe gửi lên (suggestion popup)
      box.style.height = e.data.height + 'px';
    }
  });
</script>
