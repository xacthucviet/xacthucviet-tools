<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Agoda Search Box</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      /* Container chính */
      .agoda-search-wrapper {
        width: 100%;
        max-width: 360px;
        margin: 0 auto;
        position: relative;
      }

      /* Giữ khung cao cơ bản */
      .agoda-search-container {
        position: relative;
        width: 100%;
        height: 130px;
        transition: height 0.3s ease;
        overflow: visible;
      }

      /* Nếu có suggestion, cho phép tràn */
      .agoda-search-container.expanded {
        overflow: visible;
        z-index: 9999;
      }

      /* Agoda iframe nhúng */
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* Giả lập hộp tìm kiếm nếu test nội bộ */
      .fake-search-box {
        width: 100%;
        border: 1px solid #ccc;
        padding: 8px 10px;
        border-radius: 6px;
        box-sizing: border-box;
      }

      .SuggestionList {
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-top: 4px;
        max-height: 220px;
        overflow-y: auto;
        position: absolute;
        width: 100%;
        z-index: 10000;
      }

      .SuggestionItem {
        padding: 8px 10px;
        cursor: pointer;
      }

      .SuggestionItem:hover {
        background: #f0f0f0;
      }
    </style>
  </head>

  <body>
    <div class="agoda-search-wrapper">
      <div class="agoda-search-container" id="searchBox">
        <!-- 🔹 Đây là nơi bạn nhúng hộp tìm kiếm Agoda thật -->
        <input
          type="search"
          class="fake-search-box"
          id="searchInput"
          placeholder="Tìm khách sạn, thành phố..."
        />
        <div class="SuggestionList" id="suggestions" style="display: none"></div>
      </div>
    </div>

    <script>
      const input = document.getElementById("searchInput");
      const suggestionBox = document.getElementById("suggestions");
      const container = document.getElementById("searchBox");

      const demoSuggestions = [
        "Nha Trang",
        "Đà Lạt",
        "Phan Thiết",
        "Vũng Tàu",
        "Hà Nội",
        "Hội An",
        "Phú Quốc",
      ];

      // Hàm render suggestions demo
      function showSuggestions(query) {
        if (!query) {
          suggestionBox.style.display = "none";
          container.classList.remove("expanded");
          notifyParentHeight(130);
          return;
        }

        const filtered = demoSuggestions.filter((s) =>
          s.toLowerCase().includes(query.toLowerCase())
        );
        suggestionBox.innerHTML = filtered
          .map((s) => `<div class="SuggestionItem">${s}</div>`)
          .join("");
        suggestionBox.style.display = "block";
        container.classList.add("expanded");
        notifyParentHeight();
      }

      // Gửi chiều cao thật của box ra ngoài
      function notifyParentHeight(fixedHeight) {
        const suggestions = document.querySelector(".SuggestionList");
        const height = fixedHeight
          ? fixedHeight
          : Math.min(
              (suggestions?.scrollHeight || 0) + 160, // 160 cho input + padding
              500
            );

        window.parent.postMessage({ type: "resize", height }, "*");
      }

      // Lắng nghe sự kiện gõ
      input.addEventListener("input", (e) => {
        showSuggestions(e.target.value);
      });

      input.addEventListener("focus", () => {
        notifyParentHeight();
        window.parent.postMessage("agoda-focus", "*");
      });

      input.addEventListener("blur", () => {
        setTimeout(() => {
          suggestionBox.style.display = "none";
          container.classList.remove("expanded");
          notifyParentHeight(130);
          window.parent.postMessage("agoda-blur", "*");
        }, 200);
      });
    </script>
  </body>
</html>
