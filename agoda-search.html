<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Agoda Search Widget</title>
<style>
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: visible;
  -webkit-text-size-adjust: 100%;
}
#adgshp1134854488 {
  width: 100%;
  height: 48px; /* search box height mặc định */
  overflow: visible;
  position: relative;
  z-index: 9999;
}
input, select, textarea, button {
  font-size: 16px !important;
  line-height: 1.4;
}
</style>
</head>
<body>
<div id="adgshp1134854488"></div>

<script src="//cdn0.agoda.net/images/sherpa/js/sherpa_init1_08.min.js"></script>
<script>
var stg = {};
stg.crt = "8068189953740";
stg.version = "1.04";
stg.id = stg.name = "adgshp1134854488";
stg.width = "300px";
stg.height = "48px";
stg.ReferenceKey = "esMvFFB9Yqj7ourN0hnRjg==";
stg.Layout = "Wide";
stg.Language = "vi-vn";
stg.Cid = "1950843";
stg.City = "15932"; // Đà Lạt
stg.DestinationName = "Đà Lạt, Việt Nam";
stg.OverideConf = false;
new AgdSherpa(stg).initialize();
</script>

<script>
function sendHeight() {
  const body = document.body;
  const height = Math.max(body.scrollHeight, body.offsetHeight, 48);
  window.parent.postMessage({ type: 'resize', height }, '*');
}

// focus/blur
document.addEventListener('focusin', () => {
  window.parent.postMessage('agoda-focus', '*');
  setTimeout(sendHeight, 100);
});
document.addEventListener('focusout', () => {
  window.parent.postMessage('agoda-blur', '*');
  setTimeout(sendHeight, 200);
});

// Đo định kỳ (cho suggestion popup)
setInterval(sendHeight, 800);

// Khi chọn suggestion
document.addEventListener('click', (e) => {
  const target = e.target;
  if (target.closest('.sherpa-suggestion')) {
    window.parent.postMessage('agoda-select-suggestion', '*');
  }
});
</script>
</body>
</html>
