<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Agoda Search Widget</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: visible;
      -webkit-text-size-adjust: 100%;
    }

    /* Widget container */
    .widget-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      overflow: visible;
      position: relative;
      z-index: 9999;
    }

    /* Agoda widget frame */
    #adgshp1134854488 {
      width: 320px;
      height: 96px; /* Mặc định vừa search box */
      overflow: visible;
      position: relative;
      z-index: 9999;
      transform: scale(1);
      transform-origin: top center;
    }

    /* Input font-size chuẩn mobile Safari */
    input, select, textarea, button {
      font-size: 16px !important;
      line-height: 1.4;
    }

    /* Mobile tuning */
    @media (max-width: 480px) {
      #adgshp1134854488 {
        width: 320px;
        height: 96px; /* chỉ search box */
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="widget-wrapper">
    <div id="adgshp1134854488"></div>
  </div>

  <!-- Agoda script -->
  <script src="//cdn0.agoda.net/images/sherpa/js/sherpa_init1_08.min.js"></script>
  <script>
    var stg = {};
    stg.crt = "8068189953740";
    stg.version = "1.04";
    stg.id = stg.name = "adgshp1134854488";
    stg.width = "320px";
    stg.height = "96px";
    stg.ReferenceKey = "esMvFFB9Yqj7ourN0hnRjg==";
    stg.Layout = "Wide";
    stg.Language = "vi-vn";
    stg.Cid = "1950843";
    stg.City = "15932"; // Đà Lạt
    stg.DestinationName = "Đà Lạt, Việt Nam";
    stg.OverideConf = false;
    new AgdSherpa(stg).initialize();
  </script>

  <!-- Resize + focus/blur signaling -->
  <script>
    function sendHeight() {
      const body = document.body;
      const height = Math.max(body.scrollHeight, body.offsetHeight, 96);
      window.parent.postMessage({ type: "resize", height }, "*");
    }

    document.addEventListener("focusin", () => {
      window.parent.postMessage("agoda-focus", "*");
      setTimeout(sendHeight, 200);
    });

    document.addEventListener("focusout", () => {
      window.parent.postMessage("agoda-blur", "*");
      setTimeout(() => sendHeight(), 400);
    });

    // Periodic resize (suggestion load chậm)
    setInterval(sendHeight, 800);
  </script>
</body>
</html>
