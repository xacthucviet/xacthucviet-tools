<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Agoda Search Widget</title>
  <style>
    html, body {
      margin:0; padding:0;
      width:100%; height:100%;
      background: transparent;
      overflow: visible;
      -webkit-text-size-adjust: 100%;
    }

    .widget-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: auto;
      overflow: visible;
      position: relative;
    }

    #adgshp1134854488 {
      width: 100%;
      height: 96px; /* initial height desktop */
      overflow: visible;
      position: relative;
    }

    input, select, textarea, button {
      font-size:16px !important;
      line-height:1.4;
    }

    @media(max-width:480px){
      #adgshp1134854488 { height:48px; } /* mobile textbox height */
    }
  </style>
</head>
<body>
  <div class="widget-wrapper">
    <div id="adgshp1134854488"></div>
  </div>

  <!-- Agoda script -->
  <script src="//cdn0.agoda.net/images/sherpa/js/sherpa_init1_08.min.js"></script>
  <script>
    var stg = {};
    stg.crt = "8068189953740";
    stg.version = "1.04";
    stg.id = stg.name = "adgshp1134854488";
    stg.width = "100%";
    stg.height = "96px";
    stg.ReferenceKey = "esMvFFB9Yqj7ourN0hnRjg==";
    stg.Layout = "Wide";
    stg.Language = "vi-vn";
    stg.Cid = "1950843";
    stg.City = "15932";
    stg.DestinationName = "Đà Lạt, Việt Nam";
    stg.OverideConf = false;
    new AgdSherpa(stg).initialize();
  </script>

  <script>
    function sendHeight(){
      const body = document.body;
      const height = Math.max(body.scrollHeight, body.offsetHeight, window.innerWidth<=480?48:96);
      window.parent.postMessage({type:'resize',height},'*');
    }

    document.addEventListener('focusin',()=>{
      window.parent.postMessage('agoda-focus','*');
      setTimeout(sendHeight,200);
    });

    document.addEventListener('focusout',()=>{
      window.parent.postMessage('agoda-blur','*');
      setTimeout(sendHeight,400);
    });

    setInterval(sendHeight,800); // fallback
  </script>
</body>
</html>
