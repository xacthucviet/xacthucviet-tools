<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Agoda Search Widget</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      width: 100%;
      height: 100%;
      overflow: visible;
      -webkit-text-size-adjust: 100%;
    }

    /* Wrapper căn giữa widget */
    .widget-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: auto;
      overflow: visible;
      position: relative;
      z-index: 9999;
    }

    /* Khung search box */
    #adgshp1134854488 {
      width: 320px;
      height: 48px; /* mobile và desktop mặc định */
      transform: scale(1);
      transform-origin: top center;
      overflow: visible;
      z-index: 9999;
      position: relative;
    }

    /* Đảm bảo font đủ lớn để Safari không zoom */
    input, select, textarea, button {
      font-size: 16px !important;
      line-height: 1.4;
    }

    /* Mobile tuning */
    @media (max-width: 480px) {
      #adgshp1134854488 {
        width: 100%;
        max-width: 360px;
        height: 48px !important; /* giữ height cố định */
        transform: scale(1);
        transform-origin: top center;
      }
    }
  </style>
</head>
<body>
  <div class="widget-wrapper">
    <div id="adgshp1134854488"></div>
  </div>

  <!-- Agoda script -->
  <script src="//cdn0.agoda.net/images/sherpa/js/sherpa_init1_08.min.js"></script>
  <script>
    var stg = {};
    stg.crt = "8068189953740";
    stg.version = "1.04";
    stg.id = stg.name = "adgshp1134854488";
    stg.width = "300px";
    stg.height = "48px"; // mặc định
    stg.ReferenceKey = "esMvFFB9Yqj7ourN0hnRjg==";
    stg.Layout = "Wide";
    stg.Language = "vi-vn";
    stg.Cid = "1950843";
    stg.City = "15932"; // Đà Lạt
    stg.DestinationName = "Đà Lạt, Việt Nam";
    stg.OverideConf = false;
    new AgdSherpa(stg).initialize();
  </script>

  <!-- Gửi tín hiệu focus/blur + height -->
  <script>
    function sendHeight() {
      const body = document.body;
      const height = Math.max(body.scrollHeight, body.offsetHeight, 48);
      window.parent.postMessage({ type: "resize", height }, "*");
    }

    // Khi input focus
    document.addEventListener("focusin", () => {
      window.parent.postMessage("agoda-focus", "*");
      setTimeout(sendHeight, 200);
    });

    // Khi input blur
    document.addEventListener("focusout", () => {
      window.parent.postMessage("agoda-blur", "*");
      setTimeout(() => sendHeight(), 400);
    });

    // Chạy định kỳ vì suggestion có thể render chậm
    setInterval(sendHeight, 800);

    // Khi người dùng chọn suggestion, thu lại height
    document.addEventListener("click", (e) => {
      if (e.target.closest(".sherpa-suggestion")) {
        window.parent.postMessage("agoda-select-suggestion", "*");
        setTimeout(() => sendHeight(), 200);
      }
    });
  </script>
</body>
</html>
