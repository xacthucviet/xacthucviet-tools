<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Agoda Search Widget</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: visible; /* ✅ Cho phép suggestion xổ ra */
        width: 100%;
        height: 100%;
        -webkit-text-size-adjust: 100%;
      }

      /* ✅ Khung căn giữa widget */
      .widget-wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        width: 100%;
        height: 100%;
        overflow: visible; /* ✅ Cho phép suggestion tràn ra */
        position: relative;
        z-index: 9999;
      }

      /* ✅ Scale vừa khít 320x96, vẫn cho phép popup xổ ra */
      #adgshp1134854488 {
        transform: scale(0.9);
        transform-origin: top center;
        width: 320px;
        height: 96px;
        overflow: visible;
        z-index: 9999;
        position: relative;
      }

      /* ✅ Giữ font đủ lớn để Safari không zoom */
      input,
      select,
      textarea,
      button {
        font-size: 16px !important;
        line-height: 1.4;
      }

      /* ✅ Mobile tuning */
      @media (max-width: 480px) {
        #adgshp1134854488 {
          transform: scale(0.84);
          transform-origin: top center;
        }
      }
    </style>
  </head>

  <body>
    <div class="widget-wrapper">
      <div id="adgshp1134854488"></div>
    </div>

    <!-- Agoda script -->
    <script
      type="text/javascript"
      src="//cdn0.agoda.net/images/sherpa/js/sherpa_init1_08.min.js"
    ></script>
    <script type="text/javascript">
      var stg = {};
      stg.crt = "8068189953740";
      stg.version = "1.04";
      stg.id = stg.name = "adgshp1134854488";
      stg.width = "300px";
      stg.height = "96px";
      stg.ReferenceKey = "esMvFFB9Yqj7ourN0hnRjg==";
      stg.Layout = "Wide";
      stg.Language = "vi-vn";
      stg.Cid = "1950843";
      stg.City = "15932"; // Đà Lạt
      stg.DestinationName = "Đà Lạt, Việt Nam";
      stg.OverideConf = false;
      new AgdSherpa(stg).initialize();
    </script>

    <!-- ✅ Gửi tín hiệu focus/blur + height thật ra ngoài -->
    <script>
      function sendHeight() {
        const body = document.body;
        const height = Math.max(
          body.scrollHeight,
          body.offsetHeight,
          160 // tối thiểu
        );
        window.parent.postMessage({ type: "resize", height }, "*");
      }

      // focus/blur từ input trong iframe Agoda
      document.addEventListener("focusin", () => {
        window.parent.postMessage("agoda-focus", "*");
        setTimeout(sendHeight, 200);
      });

      document.addEventListener("focusout", () => {
        window.parent.postMessage("agoda-blur", "*");
        setTimeout(() => sendHeight(), 400);
      });

      // Đo định kỳ vì suggestion có thể hiện chậm
      setInterval(sendHeight, 800);
    </script>
  </body>
</html>
