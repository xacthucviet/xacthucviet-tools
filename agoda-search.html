<!-- Softr Parent Container -->
<style>
  /* --- Wrapper cho iframe --- */
  .agoda-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
    max-width: 1150px;
    margin: 0 auto;
    position: relative;
    z-index: 5;
    overflow: visible !important;
  }

  .agoda-container {
    position: relative;
    width: 360px;  /* desktop default width */
    height: 48px;  /* initial height */
    transition: all 0.3s ease;
    z-index: 10;
    overflow: visible !important;
  }

  .agoda-container.focused {
    z-index: 99999 !important;
    position: relative;
    isolation: isolate;
  }

  .agoda-iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 11;
  }

  /* Mobile */
  @media (max-width: 480px) {
    .agoda-container {
      width: 100%;
      max-width: 360px;
      height: 48px; /* minimal height */
      overflow: visible !important;
    }
  }

  /* Phá giới hạn Softr section */
  [data-block-type="custom_code"],
  [data-element-type="custom_code"],
  .custom-html-block,
  .softr-section,
  .softr-view-wrapper,
  section,
  div[data-element-id],
  div[data-block-type],
  .content-wrapper {
    overflow: visible !important;
    position: static !important;
    z-index: auto !important;
  }

  html, body {
    overflow-x: hidden !important;
    overflow-y: auto !important;
  }

  body.agoda-focused {
    overflow-y: hidden !important;
  }
</style>

<div class="agoda-wrapper">
  <div class="agoda-container" id="agodaBox">
    <iframe class="agoda-iframe"
      src="https://xacthucviet.github.io/xacthucviet-tools/agoda-search.html"
      loading="lazy">
    </iframe>
  </div>
</div>

<script>
  const box = document.getElementById('agodaBox');

  // Nghe message từ iframe
  window.addEventListener('message', (e) => {
    if(!box) return;

    switch(e.data){
      case 'agoda-focus':
        box.classList.add('focused');
        document.body.classList.add('agoda-focused');
        // Mở overflow cho tất cả parent
        let parent = box.parentElement;
        while(parent){
          parent.style.overflow = 'visible';
          parent = parent.parentElement;
        }
        break;

      case 'agoda-blur':
      case 'agoda-select-suggestion':
        // Thu lại height ngay khi blur hoặc chọn suggestion
        box.classList.remove('focused');
        document.body.classList.remove('agoda-focused');
        box.style.height = '48px';
        break;

      default:
        // Resize từ iframe (suggestion popup)
        if(e.data?.type === 'resize' && e.data.height){
          box.style.height = e.data.height + 'px';
        }
    }
  });
</script>
